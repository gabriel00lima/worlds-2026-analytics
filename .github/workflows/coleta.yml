name: Coleta

# Atualiza o site do GitHub Pages durante o Mundial: logo depois dos jogos da noite
# (0h30 em Brasília) e no meio da tarde. Também dá para rodar na mão pela aba Actions.
on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      # jogos já processados e imagens ficam guardados entre uma execução e outra
      - uses: actions/cache@v4
        with:
          path: .cache
          key: coleta-${{ github.run_id }}
          restore-keys: coleta-

      - name: Coletar
        run: python -m worlds2026
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}

      # grava com voz neural a narração dos jogos novos; se falhar, o site sai com a voz do navegador
      - name: Narração
        continue-on-error: true
        run: |
          pip install -e ".[narracao]"
          npm install -g playwright@1.56.1
          CHROMIUM="$(which google-chrome)" python scripts/gerar_audio.py
          python -m worlds2026 --so-site

      - name: Publicar
        run: |
          git add docs/index.html docs/audio data/soloq/partidas.json
          if git diff --cached --quiet; then
            echo "nada mudou"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza os dados do site"
          git push
