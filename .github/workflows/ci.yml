name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Compila todos os scripts
        run: python -m compileall -q site-worlds curiosidades soloq resumo-diario
      - name: Testes
        run: pytest -q
      - name: Curiosidades geram sem erro
        run: python curiosidades/gerar.py
