name: CI

on: [push, pull_request]

jobs:
  qualidade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: worlds2026_teste
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests && ruff format --check src tests scripts
      - name: Tipos
        run: mypy
      - name: Testes
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=80
      - name: API e migrações no PostgreSQL
        run: pytest -q tests/test_api.py tests/test_migracoes.py
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/worlds2026_teste
