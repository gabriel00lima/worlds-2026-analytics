name: CI

on: [push, pull_request]

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests && ruff format --check src tests scripts
      - name: Tipos
        run: mypy
      - name: Testes
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=80
