[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worlds2026"
version = "1.0.0"
description = "Coleta os dados do Mundial de League of Legends 2026 e gera um site estático com chaves, estatísticas e replays."
authors = [{ name = "Gabriel Lima" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
narracao = ["edge-tts>=6.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
worlds2026 = "worlds2026.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"worlds2026.api.migracoes" = ["script.py.mako"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.run]
source = ["worlds2026"]
omit = ["*/__main__.py"]
