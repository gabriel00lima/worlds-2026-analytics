[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worlds2026"
version = "1.0.0"
description = "Coleta os dados do Mundial de League of Legends 2026 e gera um site estático com chaves, estatísticas e replays."
authors = [{ name = "Gabriel Lima" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
worlds2026 = "worlds2026.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.run]
source = ["worlds2026"]
omit = ["*/__main__.py"]
